services:
  app:
    build: .
    ports:
      - "3100:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017}
      - DB_NAME=${DB_NAME:-quickcrm}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    restart: unless-stopped
