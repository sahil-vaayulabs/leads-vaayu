services:
  app:
    build: .
    ports:
      - "3100:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=quickcrm
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
