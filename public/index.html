<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Log — Lead Tracker</title>
<style>
  :root{
    --ink:#1a2332;
    --ink-soft:#4a5568;
    --paper:#f2f1ec;
    --paper-line:#d8d6cc;
    --amber:#c17a2e;
    --amber-soft:#e8dcc8;
    --green:#3a6b4f;
    --red:#a8412f;
    --card:#ffffff;
    --mono: 'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
    --serif: 'Georgia','Iowan Old Style',serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background-image: repeating-linear-gradient(transparent, transparent 39px, var(--paper-line) 40px);
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;border-bottom:2px solid var(--ink);padding-bottom:14px;}
  h1{font-family:var(--serif);font-size:28px;margin:0;letter-spacing:0.3px;}
  .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}
  .stats{display:flex;gap:18px;font-family:var(--mono);}
  .stat{text-align:right;}
  .stat b{display:block;font-size:20px;color:var(--ink);}
  .stat span{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  button{
    font-family:var(--mono);font-size:12px;letter-spacing:0.5px;
    padding:9px 14px;border:1.5px solid var(--ink);background:var(--card);
    color:var(--ink);cursor:pointer;border-radius:2px;text-transform:uppercase;
  }
  button.primary{background:var(--ink);color:var(--paper);}
  button.primary:hover{background:#000;}
  button:hover{background:var(--amber-soft);}
  select,input,textarea{
    font-family:var(--mono);font-size:12.5px;padding:8px 10px;
    border:1.5px solid var(--paper-line);border-radius:2px;background:var(--card);color:var(--ink);
  }
  .filters{display:flex;gap:8px;margin-left:auto;}

  .entries{display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--card);border:1px solid var(--paper-line);border-left:4px solid var(--ink);
    border-radius:3px;padding:14px 16px;position:relative;
  }
  .card.status-Interested{border-left-color:var(--green);}
  .card.status-Rejected{border-left-color:var(--red);}
  .card.status-Won{border-left-color:var(--green);background:#f6faf6;}
  .card.status-Follow-up{border-left-color:var(--amber);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .biz-name{font-family:var(--serif);font-size:17px;font-weight:bold;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .badge{
    font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.6px;
    padding:3px 8px;border-radius:10px;border:1px solid var(--ink-soft);white-space:nowrap;
  }
  .badge.Interested{border-color:var(--green);color:var(--green);}
  .badge.Rejected{border-color:var(--red);color:var(--red);}
  .badge.Won{border-color:var(--green);color:var(--green);background:var(--amber-soft);}
  .badge.Follow-up{border-color:var(--amber);color:var(--amber);}
  .badge.No-Answer{border-color:var(--ink-soft);color:var(--ink-soft);}
  .badge.Not-Contacted{border-color:var(--paper-line);color:var(--ink-soft);}

  .card-body{margin-top:8px;font-size:13px;color:var(--ink);}
  .card-notes{font-style:italic;color:var(--ink-soft);margin-top:6px;font-size:12.5px;}
  .card-actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .card-actions select,.card-actions input{font-size:11px;padding:5px 7px;}
  .next-action{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:6px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-family:var(--mono);font-size:13px;}

  .modal-bg{position:fixed;inset:0;background:rgba(26,35,50,0.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--card);width:100%;max-width:480px;padding:22px;border-radius:4px;border:2px solid var(--ink);}
  .modal h2{font-family:var(--serif);margin:0 0 14px;font-size:19px;}
  .field{margin-bottom:11px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);}
  .field input,.field select,.field textarea{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .close-x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Field Log</h1>
      <div class="sub">Solar outreach — call &amp; follow-up tracker</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <button class="primary" onclick="openModal()">+ New Entry</button>
    <div class="filters">
      <select id="filterStatus" onchange="render()">
        <option value="">All statuses</option>
        <option>Not Contacted</option>
        <option>No Answer</option>
        <option>Interested</option>
        <option>Follow-up</option>
        <option>Rejected</option>
        <option>Won</option>
      </select>
      <input id="search" placeholder="search name / city..." oninput="render()" style="min-width:180px;">
    </div>
  </div>

  <div class="entries" id="entries"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">New Lead</h2>
    <div class="field"><label>Business name</label><input id="f_name"></div>
    <div class="row2">
      <div class="field"><label>Phone / WhatsApp</label><input id="f_phone"></div>
      <div class="field"><label>City</label><input id="f_city"></div>
    </div>
    <div class="field"><label>Site issue observed</label><input id="f_issue" placeholder="e.g. site doesn't load, no SEO, no site"></div>
    <div class="row2">
      <div class="field"><label>Status</label>
        <select id="f_status">
          <option>Not Contacted</option>
          <option>No Answer</option>
          <option>Interested</option>
          <option>Follow-up</option>
          <option>Rejected</option>
          <option>Won</option>
        </select>
      </div>
      <div class="field"><label>Next action date</label><input id="f_nextdate" type="date"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="3"></textarea></div>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<script>
let entries = [];
let editingId = null;

async function load(){
  try{
    const res = await fetch('/api/leads');
    entries = await res.json();
  }catch(e){ entries = []; }
  render();
}

async function persist(){ /* handled per-operation */ }

function openModal(id){
  editingId = id || null;
  document.getElementById('modalBg').classList.add('open');
  if(id){
    const e = entries.find(x=>x._id===id);
    document.getElementById('modalTitle').textContent = 'Edit Lead';
    f_name.value=e.name; f_phone.value=e.phone; f_city.value=e.city;
    f_issue.value=e.issue; f_status.value=e.status; f_nextdate.value=e.nextdate||'';
    f_notes.value=e.notes||'';
  } else {
    document.getElementById('modalTitle').textContent = 'New Lead';
    ['f_name','f_phone','f_city','f_issue','f_nextdate','f_notes'].forEach(id=>document.getElementById(id).value='');
    f_status.value='Not Contacted';
  }
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); editingId=null; }

function saveEntry(){
  const name = f_name.value.trim();
  if(!name){ alert('Business name is required'); return; }
  const data = {
    name, phone:f_phone.value.trim(), city:f_city.value.trim(),
    issue:f_issue.value.trim(), status:f_status.value,
    nextdate:f_nextdate.value, notes:f_notes.value.trim(),
    updated:new Date().toISOString()
  };
  if(editingId){
    const i = entries.findIndex(x=>x.id===editingId);
    entries[i] = {...entries[i], ...data};
  } else {
    entries.unshift({id:'e'+Date.now(), created:new Date().toISOString(), ...data});
  }
  persist(); closeModal(); render();
}

function quickStatus(id, status){
  const e = entries.find(x=>x.id===id);
  e.status = status; e.updated = new Date().toISOString();
  persist(); render();
}

function deleteEntry(id){
  if(!confirm('Delete this lead?')) return;
  entries = entries.filter(x=>x.id!==id);
  persist(); render();
}

function render(){
  const filterS = document.getElementById('filterStatus').value;
  const q = document.getElementById('search').value.toLowerCase();
  let list = entries.filter(e=>{
    if(filterS && e.status!==filterS) return false;
    if(q && !(e.name.toLowerCase().includes(q) || (e.city||'').toLowerCase().includes(q))) return false;
    return true;
  });

  const stats = {
    total: entries.length,
    interested: entries.filter(e=>e.status==='Interested').length,
    won: entries.filter(e=>e.status==='Won').length,
    followup: entries.filter(e=>e.status==='Follow-up').length,
  };
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${stats.total}</b><span>Total</span></div>
    <div class="stat"><b>${stats.interested}</b><span>Interested</span></div>
    <div class="stat"><b>${stats.followup}</b><span>Follow-up</span></div>
    <div class="stat"><b>${stats.won}</b><span>Won</span></div>
  `;

  const container = document.getElementById('entries');
  if(list.length===0){
    container.innerHTML = '<div class="empty">No entries yet. Log your first call with "+ New Entry".</div>';
    return;
  }
  container.innerHTML = list.map(e=>{
    const statusClass = e.status.replace(/\s/g,'-');
    return `
    <div class="card status-${statusClass}">
      <div class="card-head">
        <div>
          <div class="biz-name">${esc(e.name)}</div>
          <div class="meta">${esc(e.city||'—')} ${e.phone?(' · '+esc(e.phone)):''}</div>
        </div>
        <span class="badge ${statusClass}">${e.status}</span>
      </div>
      ${e.issue?`<div class="card-body">Site issue: ${esc(e.issue)}</div>`:''}
      ${e.notes?`<div class="card-notes">${esc(e.notes)}</div>`:''}
      ${e.nextdate?`<div class="next-action">→ Next action: ${e.nextdate}</div>`:''}
      <div class="card-actions">
        <select onchange="quickStatus('${e.id}', this.value)">
          <option value="" disabled selected>Update status…</option>
          <option>Not Contacted</option><option>No Answer</option><option>Interested</option>
          <option>Follow-up</option><option>Rejected</option><option>Won</option>
        </select>
        <button onclick="openModal('${e.id}')">Edit</button>
        <button onclick="deleteEntry('${e.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
</body>
</html>
