<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Log — Lead Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a2332;
    --ink-soft:#4a5568;
    --paper:#f7f7f3;
    --paper-line:#e2e0d8;
    --amber:#c17a2e;
    --green:#2d7a4f;
    --red:#b44a3f;
    --blue:#2563eb;
    --font:'Montserrat',sans-serif;
    --mono:'SF Mono','Menlo',monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;}
  h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
  .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  button,select,input,textarea{font-family:var(--font);font-size:14px;border:1px solid var(--paper-line);border-radius:var(--radius);padding:8px 12px;background:#fff;color:var(--ink);outline:none;}
  button{cursor:pointer;font-weight:600;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);}
  button:active{opacity:.85;}
  button.secondary{background:transparent;color:var(--ink);border:1px solid var(--paper-line);}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar input{flex:1;min-width:120px;}
  .toolbar select{min-width:100px;}
  .toolbar .btn-group{display:flex;gap:6px;}

  /* Stats bar */
  .stats{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .stat{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--paper-line);white-space:nowrap;text-align:center;}
  .stat .num{font-size:18px;display:block;margin-bottom:1px;}

  /* Cards */
  .card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--paper-line);transition:box-shadow .15s;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .biz-name{font-weight:700;font-size:15px;line-height:1.3;}
  .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .meta a{color:var(--blue);text-decoration:none;font-weight:600;}
  .meta a:hover{text-decoration:underline;}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:6px;white-space:nowrap;}
  .not-contacted .badge,.badge.not-contacted{background:#e8e5dd;color:#5a5548;}
  .no-answer .badge,.badge.no-answer{background:#fde8c8;color:#8a5a1e;}
  .interested .badge,.badge.interested{background:#d1fae5;color:#166534;}
  .follow-up .badge,.badge.follow-up{background:#dbeafe;color:#1e40af;}
  .rejected .badge,.badge.rejected{background:#fecaca;color:#991b1b;}
  .won .badge,.badge.won{background:#166534;color:#fff;}

  .card-body{font-size:13px;color:var(--ink-soft);margin-top:8px;}
  .card-notes{font-size:12px;color:var(--ink-soft);margin-top:6px;padding:6px 8px;background:var(--paper);border-radius:6px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-height:22px;transition:max-height .2s,white-space .2s;}
  .card-notes.expanded{white-space:normal;max-height:400px;}
  .next-action{font-size:12px;color:var(--amber);font-weight:600;margin-top:6px;}
  .card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .card-actions select{font-size:12px;padding:6px 8px;flex:1;min-width:0;}
  .card-actions button{font-size:12px;padding:6px 12px;}

  .wa-link{display:inline-flex;align-items:center;gap:3px;color:#25d366;font-weight:600;text-decoration:none;font-size:12px;}
  .wa-link:hover{text-decoration:underline;}

  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative;animation:slideUp .2s;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal h2{font-size:18px;font-weight:700;margin-bottom:14px;}
  .field{margin-bottom:10px;display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:600;}
  .field input,.field select,.field textarea{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .close-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;}

  /* Upload area */
  .upload-area{border:2px dashed var(--paper-line);border-radius:var(--radius);padding:16px;text-align:center;color:var(--ink-soft);font-size:13px;cursor:pointer;margin-bottom:14px;transition:border-color .15s;}
  .upload-area:hover,.upload-area.drag{border-color:var(--blue);color:var(--blue);}
  .upload-area input{display:none;}

  @media(min-width:601px){
    .modal-bg{align-items:center;}
    .modal{border-radius:16px;}
  }
  @media(max-width:600px){
    .wrap{padding:12px 10px 80px;}
    header{flex-direction:column;align-items:flex-start;}
    h1{font-size:20px;}
    .toolbar{flex-direction:column;}
    .toolbar .btn-group{width:100%;justify-content:stretch;}
    .toolbar .btn-group button{flex:1;}
    .row2{flex-direction:column;gap:0;}
    .card-actions{flex-direction:column;}
    .card-actions select,.card-actions button{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Field Log</h1>
      <div class="sub">Solar outreach — call & follow-up tracker</div>
    </div>
    <button onclick="openModal()">+ Lead</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input id="search" placeholder="Search name, city…" oninput="render()">
    <select id="filterStatus" onchange="render()">
      <option value="">All status</option>
      <option>Not Contacted</option><option>No Answer</option><option>Interested</option>
      <option>Follow-up</option><option>Rejected</option><option>Won</option>
    </select>
    <div class="btn-group">
      <button class="secondary" onclick="toggleUpload()">Upload</button>
    </div>
  </div>

  <div id="uploadSection" style="display:none;">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('xlsxFile').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault();this.classList.remove('drag');handleFile(event.dataTransfer.files[0])">
      Drop .xlsx file here or tap to browse
      <input type="file" id="xlsxFile" accept=".xlsx,.xls" onchange="handleFile(this.files[0])">
    </div>
  </div>

  <div id="list"></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h2 id="modalTitle">New Lead</h2>
    <div class="field"><label>Business Name *</label><input id="f_name"></div>
    <div class="row2">
      <div class="field"><label>Phone</label><input id="f_phone" type="tel"></div>
      <div class="field"><label>City</label><input id="f_city"></div>
    </div>
    <div class="field"><label>Website / Issue</label><input id="f_issue"></div>
    <div class="row2">
      <div class="field"><label>Status</label>
        <select id="f_status">
          <option>Not Contacted</option><option>No Answer</option><option>Interested</option>
          <option>Follow-up</option><option>Rejected</option><option>Won</option>
        </select>
      </div>
      <div class="field"><label>Next Action</label><input id="f_nextdate" type="date"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="3"></textarea></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
let entries = [];
let editingId = null;

async function load(){
  try{
    const res = await fetch('/api/leads');
    entries = await res.json();
  }catch(e){ entries = []; }
  render();
}

function openModal(id){
  editingId = id || null;
  document.getElementById('modalBg').classList.add('open');
  if(id){
    const e = entries.find(x=>x._id===id);
    document.getElementById('modalTitle').textContent = 'Edit Lead';
    f_name.value=e.name; f_phone.value=e.phone||''; f_city.value=e.city||'';
    f_issue.value=e.issue||''; f_status.value=e.status; f_nextdate.value=e.nextdate||'';
    f_notes.value=e.notes||'';
  } else {
    document.getElementById('modalTitle').textContent = 'New Lead';
    ['f_name','f_phone','f_city','f_issue','f_nextdate','f_notes'].forEach(id=>document.getElementById(id).value='');
    f_status.value='Not Contacted';
  }
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); editingId=null; }

async function saveEntry(){
  const name = f_name.value.trim();
  if(!name){ alert('Business name is required'); return; }
  const data = {
    name, phone:f_phone.value.trim(), city:f_city.value.trim(),
    issue:f_issue.value.trim(), status:f_status.value,
    nextdate:f_nextdate.value, notes:f_notes.value.trim()
  };
  if(editingId){
    await fetch('/api/leads/'+editingId, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  } else {
    await fetch('/api/leads', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  }
  closeModal(); load();
}

async function quickStatus(id, status){
  await fetch('/api/leads/'+id, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status})});
  load();
}

async function deleteEntry(id){
  if(!confirm('Delete this lead?')) return;
  await fetch('/api/leads/'+id, {method:'DELETE'});
  load();
}

function toggleUpload(){
  const s = document.getElementById('uploadSection');
  s.style.display = s.style.display==='none' ? 'block' : 'none';
}

async function handleFile(file){
  if(!file) return;
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data);
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

  // Map Google Maps export columns
  const mapped = rows.map(r => ({
    name: r['qBF1Pd'] || r['Name'] || r['name'] || '',
    phone: cleanPhone(r['UsdlK'] || r['Phone'] || r['phone'] || ''),
    city: extractCity(r['W4Efsd'] || r['Address'] || r['city'] || ''),
    issue: r['lcr4fd href'] || r['Website'] || r['website'] || '',
    status: 'Not Contacted',
    notes: [r['MW4etd']||'', r['UY7F9']||''].filter(Boolean).join(' · ')
  })).filter(r => r.name);

  if(!mapped.length){ alert('No leads found in file'); return; }
  if(!confirm(`Import ${mapped.length} leads as "Not Contacted"?`)) return;

  const res = await fetch('/api/leads/bulk', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(mapped)
  });
  const result = await res.json();
  alert(`Imported ${result.count} leads`);
  document.getElementById('uploadSection').style.display='none';
  load();
}

function cleanPhone(p){
  if(!p) return '';
  return String(p).replace(/[^\d+]/g,'');
}
function extractCity(addr){
  if(!addr) return '';
  // Take last meaningful part before pin/zip
  const parts = String(addr).split(',').map(s=>s.trim());
  return parts.length > 1 ? parts[parts.length-2] || parts[0] : parts[0];
}

function whatsappLink(phone){
  if(!phone) return '';
  let num = String(phone).replace(/[^\d]/g,'');
  if(num.length===10) num = '91'+num;
  return `https://wa.me/${num}`;
}

function renderStats(){
  const counts = {};
  entries.forEach(e=>{ counts[e.status] = (counts[e.status]||0)+1; });
  const order = ['Not Contacted','No Answer','Interested','Follow-up','Rejected','Won'];
  document.getElementById('stats').innerHTML = `<div class="stat"><span class="num">${entries.length}</span>Total</div>` +
    order.filter(s=>counts[s]).map(s=>{
      const cls = s.toLowerCase().replace(/\s+/g,'-');
      return `<div class="stat"><span class="num">${counts[s]}</span>${s}</div>`;
    }).join('');
}

function render(){
  renderStats();
  const filterS = document.getElementById('filterStatus').value;
  const q = document.getElementById('search').value.toLowerCase();
  let list = entries.filter(e=>{
    if(filterS && e.status!==filterS) return false;
    if(q && !(e.name.toLowerCase().includes(q) || (e.city||'').toLowerCase().includes(q) || (e.phone||'').includes(q))) return false;
    return true;
  });

  if(!list.length){
    document.getElementById('list').innerHTML = `<div class="empty">${entries.length ? 'No matches' : 'No leads yet — tap + Lead or upload a file'}</div>`;
    return;
  }

  document.getElementById('list').innerHTML = list.map(e=>{
    const statusClass = e.status.toLowerCase().replace(/\s+/g,'-');
    const phone = e.phone || '';
    const phoneHtml = phone
      ? `<a href="tel:${phone}">${esc(phone)}</a> · <a href="${whatsappLink(phone)}" class="wa-link" target="_blank">WA</a>`
      : '';
    const notesHtml = e.notes
      ? `<div class="card-notes" onclick="this.classList.toggle('expanded')">${esc(e.notes)}</div>`
      : '';

    return `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="biz-name">${esc(e.name)}</div>
          <div class="meta">${esc(e.city||'—')}${phoneHtml ? ' · '+phoneHtml : ''}</div>
        </div>
        <span class="badge ${statusClass}">${e.status}</span>
      </div>
      ${e.issue?`<div class="card-body">${esc(e.issue)}</div>`:''}
      ${notesHtml}
      ${e.nextdate?`<div class="next-action">Next: ${e.nextdate}</div>`:''}
      <div class="card-actions">
        <select onchange="quickStatus('${e._id}', this.value)">
          <option value="" disabled selected>Status…</option>
          <option>Not Contacted</option><option>No Answer</option><option>Interested</option>
          <option>Follow-up</option><option>Rejected</option><option>Won</option>
        </select>
        <button class="secondary" onclick="openModal('${e._id}')">Edit</button>
        <button class="secondary" onclick="deleteEntry('${e._id}')" style="color:var(--red)">Del</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
</body>
</html>
