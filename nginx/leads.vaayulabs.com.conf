# leads.vaayulabs.com
# QuickCRM — proxies to Docker container on port {{PORT}}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name leads.vaayulabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → app
server {
    listen 443 ssl http2;
    server_name leads.vaayulabs.com;

    ssl_certificate     /etc/letsencrypt/live/leads.vaayulabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leads.vaayulabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css text/html;
}
